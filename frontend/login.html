<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课堂实时语音转写系统 - 登录</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="bg"></div>

    <div class="login-box">

        <div class="logo">
            🎓
        </div>

        <h1>课堂实时语音转写系统</h1>

        <p>Classroom Speech Recognition</p>

        <div class="input-group">
            <label>用户名</label>
            <input
                type="text"
                id="username"
                placeholder="请输入用户名">
        </div>

        <div class="input-group">
            <label>密码</label>
            <input
                type="password"
                id="password"
                placeholder="请输入密码">
        </div>

        <div class="remember">

            <label>

                <input
                    type="checkbox"
                    id="remember">

                记住账号

            </label>

        </div>

        <button
            id="loginBtn"
            class="login-btn">

            登 录

        </button>

        <div class="bottom">

            <span>没有账号？</span>

            <a href="register.html">

                立即注册

            </a>

        </div>

    </div>

    <script src="js/login.js"></script>

</body>

</html>
