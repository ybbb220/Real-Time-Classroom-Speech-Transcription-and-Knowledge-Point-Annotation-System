<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课堂实时语音转写系统 - 用户注册</title>

    <link rel="stylesheet" href="css/register.css">
</head>

<body>

    <div class="bg"></div>

    <div class="register-box">

        <div class="logo">
            📝
        </div>

        <h1>用户注册</h1>

        <p>Classroom Speech Recognition System</p>

        <!-- 用户名 -->
        <div class="input-group">

            <label>用户名</label>

            <input
                type="text"
                id="username"
                placeholder="请输入用户名">

        </div>

        <!-- 密码 -->
        <div class="input-group">

            <label>密码</label>

            <input
                type="password"
                id="password"
                placeholder="请输入密码">

        </div>

        <!-- 确认密码 -->
        <div class="input-group">

            <label>确认密码</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="请再次输入密码">

        </div>

        <!-- 注册按钮 -->
        <button
            id="registerBtn"
            class="register-btn">

            注 册

        </button>

        <!-- 返回登录 -->
        <div class="bottom">

            <span>已有账号？</span>

            <a href="login.html">

                返回登录

            </a>

        </div>

    </div>

    <script src="js/register.js"></script>

</body>

</html>
